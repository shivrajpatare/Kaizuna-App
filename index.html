<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fast, secure, and lightweight app to store and copy your job seeker profiles.">
    <title>Kizuna</title>

    <!-- Google Fonts: Inter & Outfit for Premium Typography -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Phosphor Icons (Lightweight Vector Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>

<body>
    <div id="app">
        <!-- Background Ambient Elements -->
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>

        <header class="app-header">
            <div class="controls">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i class="ph-fill ph-moon"></i>
                </button>
            </div>
        </header>

        <main>
            <section class="hero-text">
                <h1>Your Digital Identity, <span class="gradient-text">Ready to Paste.</span></h1>
                <p>Store your specialized links securely. One click to copy.</p>
            </section>

            <div id="card-grid" class="card-grid">
                <!-- Cards will be injected here via JS -->
            </div>

            <div id="empty-state" class="empty-state hidden">
                <i class="ph-duotone ph-folder-dashed"></i>
                <p>No handles yet. Add your first one!</p>
            </div>
        </main>

        <!-- Floating Add Button (Original Style) -->
        <button id="add-btn" class="primary-btn fixed-bottom-btn">
            <i class="ph-bold ph-plus"></i> New Handle
        </button>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="modal-overlay hidden" aria-hidden="true">
            <div class="modal" role="dialog" aria-labelledby="modal-title">
                <div class="modal-header">
                    <h2 id="modal-title">Add New Handle</h2>
                    <button id="close-modal" class="icon-btn-sm"><i class="ph-bold ph-x"></i></button>
                </div>
                <form id="handle-form">
                    <div class="form-group">
                        <label for="platform-name">Platform</label>
                        <div class="select-wrapper">
                            <select id="platform-select">
                                <option value="custom">Custom</option>
                                <option value="github">GitHub</option>
                                <option value="linkedin">LinkedIn</option>
                                <option value="twitter">X (Twitter)</option>
                                <option value="portfolio">Portfolio</option>
                                <option value="email">Email</option>
                                <option value="discord">Discord</option>
                                <option value="leetcode">LeetCode</option>
                            </select>
                            <i class="ph-bold ph-caret-down"></i>
                        </div>
                        <input type="text" id="platform-name" placeholder="e.g., My Blog" required>
                    </div>

                    <div class="form-group">
                        <label for="handle-value">Link or Username</label>
                        <input type="text" id="handle-value" placeholder="https://..." required>
                    </div>

                    <div class="form-footer">
                        <button type="submit" class="primary-btn full-width">Save Handle</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast Notification Container -->
        <div id="toast-container"></div>
    </div>

    <!-- Main Logic -->
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
